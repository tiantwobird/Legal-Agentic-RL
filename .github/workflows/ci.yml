name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 核心层零第三方依赖：不装 torch，几秒钟完成。
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 语料随仓库分发；SQLite 快照由它确定性生成，不进 git。
      - name: Build SQLite snapshot
        run: python -m legalagent.data.build_db

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Validate task splits
        run: python -m legalagent.data.validate_tasks
